[project]
name = "proba-2-gif-generator"
version = "0.1.0"
description = "Calibrated, tinted PROBA-2 SWAP images and GIFs from raw .cadu dumps"
requires-python = ">=3.14"
dependencies = [
    "astropy>=8.0.2",
    "imageio>=2.37",
    "imageio-ffmpeg>=0.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
    "sunpy>=8.0.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
    "sunpy[timeseries,visualization]>=8.0.1",
    "ty>=0.0.78",
]


[tool.ruff]
target-version = "py314"
line-length = 119
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "TCH", # flake8-type-checking
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = false

[tool.ty.rules]
all = "warn"

